<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculators</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 25px; }
        section { border: 1px solid gray; padding: 15px; margin-bottom: 20px; }
        .number { width: 70px; }
        input, select, button { font-size: 16px; margin: 3px; }
        button { cursor: pointer; }
    </style>
</head>
<body>
    <h1>My Calculators</h1>

    <section>
        <h2>Task 1: Dropdown calculator</h2>
        <input class="number" type="text" id="first1" value="10" aria-label="First number">
        <select id="operator1" aria-label="Operation">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>
        <input class="number" type="text" id="second1" value="5" aria-label="Second number">
        <button id="equals1" onclick="calculator1()">=</button>
        <p id="result1" aria-live="polite">Result:</p>
    </section>

    <section>
        <h2>Task 2: Radio button calculator</h2>
        <input class="number" type="text" id="first2" value="10" aria-label="First number">
        <br><br>
        <input type="radio" id="addition" name="operator2" value="+" checked>
        <label for="addition">Addition</label><br>
        <input type="radio" id="subtraction" name="operator2" value="-">
        <label for="subtraction">Subtraction</label><br>
        <input type="radio" id="multiplication" name="operator2" value="*">
        <label for="multiplication">Multiplication</label><br>
        <input type="radio" id="division" name="operator2" value="/">
        <label for="division">Division</label><br><br>
        <input class="number" type="text" id="second2" value="5" aria-label="Second number">
        <button id="equals2" onclick="calculator2()">=</button>
        <p id="result2" aria-live="polite">Result:</p>
    </section>

    <section>
        <h2>Task 3: Increase and decrease calculator</h2>
        <button id="downFirst" onclick="changeNumber('first3', -1)" aria-label="Decrease first number">▼</button>
        <input class="number" type="text" id="first3" value="10" aria-label="First number">
        <button id="upFirst" onclick="changeNumber('first3', 1)" aria-label="Increase first number">▲</button>
        <select id="operator3" aria-label="Operation">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>
        <button id="downSecond" onclick="changeNumber('second3', -1)" aria-label="Decrease second number">▼</button>
        <input class="number" type="text" id="second3" value="10" aria-label="Second number">
        <button id="upSecond" onclick="changeNumber('second3', 1)" aria-label="Increase second number">▲</button>
        <button id="equals3" onclick="calculator3()">=</button>
        <p id="result3" aria-live="polite">Result:</p>
    </section>

    <script>
        // All three calculators use this function to do the maths.
        function calculate(a, b, operator) {
            if (a.trim() === "" || b.trim() === "") {
                return "Please enter both numbers.";
            }

            a = Number(a);
            b = Number(b);

            if (!Number.isFinite(a) || !Number.isFinite(b)) {
                return "Please enter valid numbers.";
            }

            if (operator === "+") {
                return a + b;
            } else if (operator === "-") {
                return a - b;
            } else if (operator === "*") {
                return a * b;
            } else if (operator === "/") {
                if (b === 0) {
                    return "Cannot divide by zero.";
                }
                return a / b;
            }
        }

        function calculator1() {
            let a = document.getElementById("first1").value;
            let b = document.getElementById("second1").value;
            let operator = document.getElementById("operator1").value;
            document.getElementById("result1").textContent = "Result: " + calculate(a, b, operator);
        }

        function calculator2() {
            let a = document.getElementById("first2").value;
            let b = document.getElementById("second2").value;
            let operator = "+";

            if (document.getElementById("subtraction").checked) {
                operator = "-";
            } else if (document.getElementById("multiplication").checked) {
                operator = "*";
            } else if (document.getElementById("division").checked) {
                operator = "/";
            }

            document.getElementById("result2").textContent = "Result: " + calculate(a, b, operator);
        }

        function calculator3() {
            let a = document.getElementById("first3").value;
            let b = document.getElementById("second3").value;
            let operator = document.getElementById("operator3").value;
            document.getElementById("result3").textContent = "Result: " + calculate(a, b, operator);
        }

        // The amount is 1 for the up button and -1 for the down button.
        function changeNumber(id, amount) {
            let input = document.getElementById(id);
            if (input.value.trim() === "" || !Number.isFinite(Number(input.value))) {
                document.getElementById("result3").textContent = "Result: Please enter a valid number before using the arrows.";
                return;
            }
            input.value = Number(input.value) + amount;
            document.getElementById("result3").textContent = "Result: Press = to calculate.";
        }
    </script>
</body>
</html>
